name: Frontend Security Scan

on:
  push:
    branches: [main, cortex-cli]
  workflow_dispatch:

jobs:
  cortex-scan:
    # Notice: No 'environment' tag here
    uses: davesadiv/reusable-cortex-cli/.github/workflows/cortex-reusable-scan.yml@main
    with:
      image_name: "frontend-app:latest"
    secrets:
      CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
      CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
      CORTEX_API_URL: ${{ secrets.CORTEX_API_URL }}
