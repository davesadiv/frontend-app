name: Secret Debug Test

on:
  push:
    branches: [cortex-cli]

jobs:
  debug-secrets:
    runs-on: ubuntu-latest
    # Remove the 'uses' for a moment to test local access
    steps:
      - name: Check Secret Length
        run: |
          echo "URL length: ${#URL}"
          echo "KEY length: ${#KEY}"
          if [ ${#URL} -eq 0 ]; then echo "❌ URL is still empty"; exit 1; fi
        env:
          URL: ${{ secrets.CORTEX_API_URL }}
          KEY: ${{ secrets.CORTEX_API_KEY }}
