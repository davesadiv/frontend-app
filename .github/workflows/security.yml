name: Frontend App Scan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-security-scan:
    # Update 'your-org' and 'central-security-repo' to your actual names
    uses: your-org/central-security-repo/.github/workflows/cortex-reusable-scan.yml@main
    with:
      image_name: "frontend-production-image:latest"
      wait_time: "300"
    secrets:
      CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
      CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
      CORTEX_API_URL: ${{ secrets.CORTEX_API_URL }}
